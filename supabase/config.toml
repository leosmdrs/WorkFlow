# Portas na faixa 546xx, e não nos padrões 543xx do Supabase.
#
# Motivo: todo projeto Supabase nasce nas mesmas portas padrão, então
# dois deles na mesma máquina colidem — "port is already allocated" no
# supabase_db, e o start morre. Mesma razão da porta 5180 no Vite.
#
# Por que 546xx e não qualquer outra: no Windows, o Hyper-V reserva
# faixas de portas altas, e o Docker Desktop não consegue expor nada
# dentro delas — falha com "/forwards/expose returned unexpected
# status: 500", que não parece um problema de porta. A faixa 544xx
# caiu dentro de uma reserva; 546xx estava livre.
#
# Essas reservas são dinâmicas e mudam a cada boot do Windows. Se um
# dia o start voltar a falhar com esse 500, confira com:
#   netsh interface ipv4 show excludedportrange protocol=tcp
# e ou desloque este bloco, ou proteja a faixa (PowerShell admin):
#   netsh int ipv4 add excludedportrange protocol=tcp startport=54620 numberofports=10
#
# Se mexer aqui, ajuste também .env.example e o CI.

# Rota — Supabase local configuration.
# Full reference: https://supabase.com/docs/guides/cli/config

project_id = "rota"

[api]
enabled = true
port = 54621
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54622
shadow_port = 54620
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54623

[inbucket]
enabled = true
port = 54624

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180"]
jwt_expiry = 3600
enable_signup = false
enable_manual_linking = false

[auth.email]
# Cuidado: esta chave NÃO controla só o auto-cadastro por e-mail —
# ela liga e desliga o provedor de e-mail inteiro. Com `false`, o
# GoTrue recusa qualquer login com 422 email_provider_disabled
# ("Email logins are disabled"), e o app, que mascara todo erro de
# credencial por segurança, mostra apenas "usuário ou senha inválidos".
#
# Quem impede auto-cadastro é o `enable_signup = false` do bloco [auth]
# acima, que é o controle de verdade. Aqui tem que ficar `true`, senão
# ninguém entra.
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[analytics]
# Desligado: é o explorador de logs (Logflare) do Studio, que o Rota
# nunca usou. Ligado, ele sobe mais um container e reivindica a 54327 —
# uma porta que nem aparecia neste arquivo, porque o CLI aplica o
# padrão dele quando a seção não existe. Colidia com qualquer outro
# projeto Supabase na máquina. Desligar remove o conflito e o consumo,
# em vez de acrescentar mais uma porta para manter em dia.
enabled = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8183
