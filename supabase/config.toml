# Portas na faixa 544xx em vez dos padrões 543xx do Supabase.
# Todo projeto Supabase nasce nas mesmas portas, então dois deles
# na mesma máquina colidem por definição — o erro é
# "port is already allocated" no supabase_db, e o start morre.
# Deslocar o bloco inteiro deixa o Rota conviver com os outros
# projetos de quem desenvolve. Mesma razão da porta 5180 no Vite.
# Se mexer aqui, ajuste também .env.example e o CI.

# Rota — Supabase local configuration.
# Full reference: https://supabase.com/docs/guides/cli/config

project_id = "rota"

[api]
enabled = true
port = 54421
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54422
shadow_port = 54420
major_version = 15

[db.pooler]
enabled = false

[realtime]
enabled = true

[studio]
enabled = true
port = 54423

[inbucket]
enabled = true
port = 54424

[storage]
enabled = true
file_size_limit = "2MiB"

[auth]
enabled = true
site_url = "http://localhost:5180"
additional_redirect_urls = ["http://localhost:5180"]
jwt_expiry = 3600
enable_signup = false
enable_manual_linking = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.sms]
enable_signup = false
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8183
